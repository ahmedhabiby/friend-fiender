<div class="container">
  <div class="timeline">
    <app-time-line-profile></app-time-line-profile>
    <div id="page-contents">
      <div class="row">
        <div class="col-md-3"></div>
        <div class="col-md-7">

          <!-- Friend List
           ================================================= -->
          <div class="friend-list">
            <div class="row">
              <div class="col-md-6 col-sm-6" *ngFor="let f of friends">
                <div class="friend-card">
                  <img src="assets/images/covers/1.jpg" alt="profile-cover" class="img-responsive cover">
                  <div class="card-info">
                    <img src="assets/images/users/{{f.imageUrl}}" alt="user" class="profile-photo-lg">
                    <div class="friend-info">
                      <a href="#" class="pull-right text-green">My Friend</a>
                      <h5><a href="timeline.html" class="profile-link">{{ f.userName }}</a></h5>
                      <p>{{ f.jop }}</p>
                    </div>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>

        <app-time-line-detailes></app-time-line-detailes>
      </div>
    </div>

  </div>
</div>
